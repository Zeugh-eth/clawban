<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦞 Clawban Dashboard V2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg-primary: #0d1117;
    --bg-secondary: #161b22;
    --bg-tertiary: #21262d;
    --bg-card: #1c2128;
    --border: #30363d;
    --border-hover: #58a6ff;
    --text-primary: #e6edf3;
    --text-secondary: #8b949e;
    --text-muted: #6e7681;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --purple: #bc8cff;
    --orange: #fb8500;
  }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.5;
    overflow-x: hidden;
  }
  
  .header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  
  .header-content {
    max-width: 1800px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  
  .header-left { display: flex; align-items: center; gap: 20px; }
  .header h1 { 
    font-size: 18px; 
    font-weight: 600; 
    display: flex; 
    align-items: center; 
    gap: 8px; 
  }
  .header h1 .emoji { font-size: 22px; }
  .version-badge {
    background: var(--purple);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
  }
  
  .stats {
    display: flex;
    gap: 20px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .stat { display: flex; align-items: center; gap: 6px; }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; }
  
  .filters {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    position: sticky;
    top: 50px;
    z-index: 99;
  }
  
  .filters-content {
    max-width: 1800px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  
  .filter-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .filter-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .filter-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  
  .filter-chip {
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 14px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
  }
  
  .filter-chip:hover {
    background: var(--border);
    color: var(--text-primary);
    border-color: var(--accent);
  }
  
  .filter-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }
  
  .filter-chip .count {
    opacity: 0.7;
    font-size: 10px;
    margin-left: 4px;
  }
  
  .view-toggle {
    margin-left: auto;
    display: flex;
    gap: 4px;
    background: var(--bg-tertiary);
    padding: 3px;
    border-radius: 6px;
  }
  
  .view-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    padding: 5px 12px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.12s;
  }
  
  .view-btn:hover { background: var(--border); color: var(--text-primary); }
  .view-btn.active { background: var(--accent); color: white; }
  
  .container {
    max-width: 1800px;
    margin: 0 auto;
    padding: 16px 20px;
    height: calc(100vh - 110px);
    overflow: hidden;
  }
  
  .kanban-view {
    display: flex;
    gap: 12px;
    height: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 8px;
  }
  
  .kanban-column {
    min-width: 280px;
    max-width: 320px;
    flex: 1;
    background: var(--bg-secondary);
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  
  .kanban-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  
  .kanban-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-primary);
  }
  
  .kanban-count {
    background: var(--bg-tertiary);
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 700;
  }
  
  .kanban-body {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
  }
  
  .kanban-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  
  .kanban-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    transform: translateY(-1px);
  }
  
  .kanban-card.recent {
    border-left: 3px solid var(--accent);
  }
  
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  
  .task-id {
    font-family: 'Monaco', 'Courier New', monospace;
    font-size: 10px;
    color: var(--text-muted);
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 3px;
  }
  
  .priority-badge {
    font-size: 16px;
    line-height: 1;
  }
  
  .card-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 8px;
    color: var(--text-primary);
  }
  
  .card-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  
  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
  }
  
  .meta-label {
    color: var(--text-muted);
    font-weight: 600;
  }
  
  .meta-value {
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .agent-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--bg-tertiary);
    padding: 2px 6px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
  }
  
  .agent-avatar {
    font-size: 12px;
  }
  
  .tag {
    background: rgba(88, 166, 255, 0.15);
    color: var(--accent);
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 500;
  }
  
  .task-tags {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  
  .comment-count {
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  
  .empty-column {
    text-align: center;
    color: var(--text-muted);
    padding: 24px 12px;
    font-size: 12px;
  }
  
  /* Modal for task detail */
  .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  
  .modal.active {
    display: flex;
  }
  
  .modal-content {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    max-width: 700px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 20px;
    position: relative;
  }
  
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 18px;
    transition: all 0.12s;
  }
  
  .modal-close:hover {
    background: var(--border);
    color: var(--text-primary);
  }
  
  .modal-header {
    margin-bottom: 16px;
  }
  
  .modal-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .status-badge {
    background: var(--bg-tertiary);
    color: var(--text-secondary);
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }
  
  .status-badge.complete { background: rgba(63, 185, 80, 0.2); color: var(--green); }
  .status-badge.in-progress { background: rgba(88, 166, 255, 0.2); color: var(--accent); }
  .status-badge.blocked { background: rgba(248, 81, 73, 0.2); color: var(--red); }
  .status-badge.planning { background: rgba(188, 140, 255, 0.2); color: var(--purple); }
  .status-badge.review { background: rgba(210, 153, 34, 0.2); color: var(--yellow); }
  
  .modal-meta {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 16px;
    padding: 12px;
    background: var(--bg-tertiary);
    border-radius: 6px;
  }
  
  .modal-meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  
  .modal-meta-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .modal-meta-value {
    font-size: 13px;
    color: var(--text-primary);
  }
  
  .modal-description {
    margin-bottom: 16px;
  }
  
  .modal-section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .modal-description-text {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
    background: var(--bg-tertiary);
    padding: 12px;
    border-radius: 6px;
  }
  
  .comments-section {
    background: var(--bg-tertiary);
    border-radius: 6px;
    padding: 12px;
  }
  
  .comments-header {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-secondary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .comment {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
  }
  
  .comment:last-child { margin-bottom: 0; }
  
  .comment-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  
  .comment-author {
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-primary);
  }
  
  .comment-time {
    font-size: 10px;
    color: var(--text-muted);
  }
  
  .comment-text {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  
  .loading {
    text-align: center;
    padding: 48px;
    color: var(--text-secondary);
  }
  
  .error {
    background: rgba(248, 81, 73, 0.1);
    border: 1px solid rgba(248, 81, 73, 0.3);
    color: var(--red);
    padding: 16px;
    border-radius: 8px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-content">
    <div class="header-left">
      <h1>
        <span class="emoji">🦞</span>
        Clawban
        <span class="version-badge">V2</span>
      </h1>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><div class="dot" style="background:#58a6ff"></div> <span id="stat-open">0</span> open</div>
      <div class="stat"><div class="dot" style="background:#3fb950"></div> <span id="stat-done">0</span> done</div>
      <div class="stat"><div class="dot" style="background:#8b949e"></div> <span id="stat-total">0</span> total</div>
    </div>
  </div>
</div>

<div class="filters">
  <div class="filters-content">
    <div class="filter-group">
      <span class="filter-label">Agent</span>
      <div class="filter-chips" id="agent-filters"></div>
    </div>
    <div class="filter-group">
      <span class="filter-label">Tag</span>
      <div class="filter-chips" id="tag-filters"></div>
    </div>
    <div class="view-toggle">
      <button class="view-btn active" data-view="kanban">📋 Kanban</button>
      <button class="view-btn" data-view="timeline">📝 Timeline</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="kanban-view" id="kanban-container">
    <div class="loading">Loading tasks...</div>
  </div>
</div>

<!-- Task Detail Modal -->
<div class="modal" id="task-modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeTaskModal()">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<script>
const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:18793/api' : '/api';
let allTasks = [];
let activeAgentFilter = null;
let activeTagFilter = null;
let currentView = 'kanban';

const AGENT_CONFIG = {
  pa: { label: 'PA', emoji: '🎯' },
  main: { label: 'PA', emoji: '🎯' },
  cta: { label: 'CTA', emoji: '🔧' },
  cra: { label: 'CRA', emoji: '🔬' },
  cma: { label: 'CMA', emoji: '📣' },
  cba: { label: 'CBA', emoji: '💼' },
  zeugh: { label: 'Zeugh', emoji: '👤' },
};

const KANBAN_COLUMNS = [
  { id: 'todo', label: 'To Do', statuses: ['to do', 'backlog'] },
  { id: 'planning', label: 'Planning', statuses: ['planning'] },
  { id: 'active', label: 'In Progress', statuses: ['in progress', 'update required'] },
  { id: 'blocked', label: 'Blocked', statuses: ['blocked', 'on hold'] },
  { id: 'review', label: 'Review', statuses: ['review'] },
  { id: 'done', label: 'Done', statuses: ['complete', 'cancelled'] },
];

const PRI_ICONS = { urgent: '🔴', high: '🟠', normal: '🟡', low: '🔵' };
const PRI_LABELS = { 1: 'urgent', 2: 'high', 3: 'normal', 4: 'low' };

function getAgentConfig(id) {
  return AGENT_CONFIG[id] || { label: id.toUpperCase(), emoji: '❓' };
}

function isRecent(timestamp) {
  const taskTime = new Date(timestamp);
  const now = new Date();
  const hoursSince = (now - taskTime) / (1000 * 60 * 60);
  return hoursSince < 24;
}

function formatTimeAgo(timestamp) {
  const now = new Date();
  const taskTime = new Date(timestamp);
  const seconds = Math.floor((now - taskTime) / 1000);
  
  if (seconds < 60) return 'just now';
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

function formatDate(timestamp) {
  const d = new Date(timestamp);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + 
         ' ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
}

function renderKanban(tasks) {
  const container = document.getElementById('kanban-container');
  
  const html = KANBAN_COLUMNS.map(col => {
    const colTasks = tasks.filter(t => col.statuses.includes(t.status.status));
    
    const cardsHtml = colTasks.length > 0 ? colTasks.map(task => {
      const assignee = getAgentConfig(task.assignees[0]);
      const creator = getAgentConfig(task.creator);
      const pri = task.priority?.priority ? PRI_LABELS[task.priority.priority] : 'normal';
      const priIcon = PRI_ICONS[pri] || '⚪';
      const recentClass = isRecent(task.date_updated) ? 'recent' : '';
      
      return `
        <div class="kanban-card ${recentClass}" onclick="showTaskModal('${task.id}')">
          <div class="card-header">
            <span class="task-id">${task.id}</span>
            <span class="priority-badge">${priIcon}</span>
          </div>
          <div class="card-title">${task.name}</div>
          ${task.tags && task.tags.length > 0 ? `
            <div class="task-tags">
              ${task.tags.map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
          ` : ''}
          <div class="card-meta">
            <div class="meta-row">
              <span class="meta-label">Created</span>
              <span class="meta-value">
                <span class="agent-chip">
                  <span class="agent-avatar">${creator.emoji}</span>
                  ${creator.label}
                </span>
              </span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Assigned</span>
              <span class="meta-value">
                <span class="agent-chip">
                  <span class="agent-avatar">${assignee.emoji}</span>
                  ${assignee.label}
                </span>
              </span>
            </div>
            <div class="meta-row">
              <span class="meta-label">Updated</span>
              <span class="meta-value">${formatTimeAgo(task.date_updated)}</span>
            </div>
            ${task.comments && task.comments.length > 0 ? `
              <div class="meta-row">
                <span class="comment-count">💬 ${task.comments.length} comment${task.comments.length > 1 ? 's' : ''}</span>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('') : '<div class="empty-column">No tasks</div>';
    
    return `
      <div class="kanban-column">
        <div class="kanban-header">
          <span class="kanban-title">${col.label}</span>
          <span class="kanban-count">${colTasks.length}</span>
        </div>
        <div class="kanban-body">
          ${cardsHtml}
        </div>
      </div>
    `;
  }).join('');
  
  container.innerHTML = html;
}

function showTaskModal(taskId) {
  const task = allTasks.find(t => t.id === taskId);
  if (!task) return;
  
  const assignee = getAgentConfig(task.assignees[0]);
  const creator = getAgentConfig(task.creator);
  const pri = task.priority?.priority ? PRI_LABELS[task.priority.priority] : 'normal';
  const priIcon = PRI_ICONS[pri] || '⚪';
  const statusClass = task.status.status.replace(/ /g, '-');
  
  let commentsHtml = '';
  if (task.comments && task.comments.length > 0) {
    commentsHtml = `
      <div class="comments-section">
        <div class="comments-header">💬 Comments (${task.comments.length})</div>
        ${task.comments.map(c => {
          const commentAuthor = getAgentConfig(c.author);
          return `
            <div class="comment">
              <div class="comment-header">
                <div class="comment-author">
                  <span class="agent-avatar">${commentAuthor.emoji}</span>
                  ${commentAuthor.label}
                </div>
                <span class="comment-time">${formatTimeAgo(c.at)}</span>
              </div>
              <div class="comment-text">${c.text}</div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }
  
  const modalBody = document.getElementById('modal-body');
  modalBody.innerHTML = `
    <div class="modal-header">
      <div class="modal-title">
        <span class="task-id">${task.id}</span>
        <span>${task.name}</span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center; margin-top: 8px;">
        <span class="priority-badge">${priIcon}</span>
        <span class="status-badge ${statusClass}">${task.status.status}</span>
      </div>
    </div>
    
    <div class="modal-meta">
      <div class="modal-meta-item">
        <span class="modal-meta-label">Created By</span>
        <span class="modal-meta-value">
          <span class="agent-chip">
            <span class="agent-avatar">${creator.emoji}</span>
            ${creator.label}
          </span>
        </span>
      </div>
      <div class="modal-meta-item">
        <span class="modal-meta-label">Assigned To</span>
        <span class="modal-meta-value">
          <span class="agent-chip">
            <span class="agent-avatar">${assignee.emoji}</span>
            ${assignee.label}
          </span>
        </span>
      </div>
      <div class="modal-meta-item">
        <span class="modal-meta-label">Created</span>
        <span class="modal-meta-value">${formatDate(task.date_created)}</span>
      </div>
      <div class="modal-meta-item">
        <span class="modal-meta-label">Updated</span>
        <span class="modal-meta-value">${formatDate(task.date_updated)}</span>
      </div>
    </div>
    
    ${task.description ? `
      <div class="modal-description">
        <div class="modal-section-title">Description</div>
        <div class="modal-description-text">${task.description}</div>
      </div>
    ` : ''}
    
    ${task.tags && task.tags.length > 0 ? `
      <div style="margin-bottom: 16px;">
        <div class="modal-section-title">Tags</div>
        <div class="task-tags">
          ${task.tags.map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    ` : ''}
    
    ${commentsHtml}
  `;
  
  document.getElementById('task-modal').classList.add('active');
}

function closeTaskModal() {
  document.getElementById('task-modal').classList.remove('active');
}

// Close modal on background click
document.getElementById('task-modal').addEventListener('click', (e) => {
  if (e.target.id === 'task-modal') {
    closeTaskModal();
  }
});

// Close modal on Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeTaskModal();
  }
});

function updateFilters() {
  const agentCounts = {};
  allTasks.forEach(t => {
    t.assignees.forEach(a => {
      const normalized = a === 'main' ? 'pa' : a;
      agentCounts[normalized] = (agentCounts[normalized] || 0) + 1;
    });
  });
  
  const tagCounts = {};
  allTasks.forEach(t => {
    if (t.tags) {
      t.tags.forEach(tag => {
        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
      });
    }
  });
  
  const agentFilters = document.getElementById('agent-filters');
  agentFilters.innerHTML = Object.entries(agentCounts).map(([id, count]) => {
    const agent = getAgentConfig(id);
    const activeClass = activeAgentFilter === id ? 'active' : '';
    return `
      <div class="filter-chip ${activeClass}" onclick="filterByAgent('${id}')">
        ${agent.emoji} ${agent.label} <span class="count">${count}</span>
      </div>
    `;
  }).join('');
  
  const tagFilters = document.getElementById('tag-filters');
  tagFilters.innerHTML = Object.entries(tagCounts).map(([tag, count]) => {
    const activeClass = activeTagFilter === tag ? 'active' : '';
    return `
      <div class="filter-chip ${activeClass}" onclick="filterByTag('${tag}')">
        ${tag} <span class="count">${count}</span>
      </div>
    `;
  }).join('');
  
  if (activeAgentFilter) {
    agentFilters.insertAdjacentHTML('afterbegin', '<div class="filter-chip active" onclick="filterByAgent(null)">All</div>');
  }
  if (activeTagFilter) {
    tagFilters.insertAdjacentHTML('afterbegin', '<div class="filter-chip active" onclick="filterByTag(null)">All</div>');
  }
}

function filterByAgent(agentId) {
  activeAgentFilter = agentId;
  updateFilters();
  render();
}

function filterByTag(tag) {
  activeTagFilter = tag;
  updateFilters();
  render();
}

function getFilteredTasks() {
  let tasks = allTasks;
  
  if (activeAgentFilter) {
    tasks = tasks.filter(t => t.assignees.map(a => a === 'main' ? 'pa' : a).includes(activeAgentFilter));
  }
  
  if (activeTagFilter) {
    tasks = tasks.filter(t => t.tags && t.tags.includes(activeTagFilter));
  }
  
  return tasks;
}

function render() {
  const filtered = getFilteredTasks();
  
  const done = filtered.filter(t => ['done', 'closed'].includes(t.status.type)).length;
  const open = filtered.length - done;
  document.getElementById('stat-open').textContent = open;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-total').textContent = filtered.length;
  
  renderKanban(filtered);
}

async function refresh() {
  try {
    const boardRes = await fetch(`${API_BASE}/board`);
    const board = await boardRes.json();
    allTasks = board.tasks || [];
    
    updateFilters();
    render();
  } catch (e) {
    console.error('Refresh failed:', e);
    document.getElementById('kanban-container').innerHTML = `
      <div class="error">⚠️ Failed to load tasks. Check backend server.</div>
    `;
  }
}

refresh();
setInterval(refresh, 15000);
</script>

</body>
</html>
